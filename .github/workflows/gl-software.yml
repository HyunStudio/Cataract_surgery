name: Software OpenGL Smoke
on:
  push:
    paths:
      - "ophthosim/**"
      - "tests/**"
      - "requirements-3d.txt"
      - ".github/workflows/gl-software.yml"
  workflow_dispatch:

jobs:
  mesa-opengl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Mesa headless OpenGL and Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install optional GL renderer
        run: python -m pip install -r requirements-3d.txt
      - name: Exercise OpenGL context, shaders, picking and framebuffer
        run: |
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 SDL_VIDEODRIVER=x11 SDL_AUDIODRIVER=dummy python -m ophthosim.gl_smoke
      - name: Capture GPU-path screenshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesa-opengl-screenshots
          path: build/screenshots/gl-*.png
          if-no-files-found: ignore
