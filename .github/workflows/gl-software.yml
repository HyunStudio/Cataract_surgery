name: Software OpenGL Smoke
on:
  push:
    paths:
      - "ophthosim/**"
      - "tests/**"
      - "requirements-3d.txt"
      - ".github/workflows/gl-software.yml"
  workflow_dispatch:

jobs:
  mesa-opengl:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Mesa headless OpenGL and Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
      - name: Install optional GL renderer
        run: python -m pip install -r requirements-3d.txt
      - name: Exercise OpenGL context, shaders, picking and framebuffer
        run: |
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 SDL_VIDEODRIVER=x11 SDL_AUDIODRIVER=dummy python -m ophthosim.gl_smoke
      - name: Exercise entire interactive 3D surgical workflow in Mesa OpenGL
        run: |
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 SDL_VIDEODRIVER=x11 SDL_AUDIODRIVER=dummy python -m ophthosim.gl_surgery_smoke
      - name: Short frame-time benchmark at 1920x1080 (software GL, diagnostic only)
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" env LIBGL_ALWAYS_SOFTWARE=1 SDL_VIDEODRIVER=x11 SDL_AUDIODRIVER=dummy python -m ophthosim.gl_benchmark --frames 300 --size 1920x1080 --out build/benchmark/gl-frametime-mesa.json
      - name: Short frame-time benchmark at 3840x2160 with 3x HUD magnification
        run: |
          xvfb-run -a -s "-screen 0 3840x2160x24" env LIBGL_ALWAYS_SOFTWARE=1 SDL_VIDEODRIVER=x11 SDL_AUDIODRIVER=dummy python -m ophthosim.gl_benchmark --frames 120 --size 3840x2160 --out build/benchmark/gl-frametime-mesa-4k.json
      - name: Upload frame-time report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesa-frametime-report
          path: build/benchmark/*.json
          if-no-files-found: ignore
      - name: Capture GPU-path screenshot artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mesa-opengl-screenshots
          path: build/screenshots/gl-*.png
          if-no-files-found: ignore
