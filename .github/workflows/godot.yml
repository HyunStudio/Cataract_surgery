name: Godot game
on:
  push:
    paths: ['godot/**', '.github/workflows/godot.yml']
  pull_request:
    paths: ['godot/**', '.github/workflows/godot.yml']
  workflow_dispatch:
jobs:
  game-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot
        run: |
          curl -fsSL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot*
          echo "/tmp/godot" >> "$GITHUB_PATH"
      - name: Domain, assets and input tests
        run: |
          for suite in test_session test_world test_input test_integration test_playthrough test_capsule_solver test_lens_fluid_solver test_instrument_rig test_simulator test_case_director test_case_recording test_incision_model test_iol_dynamics test_lens_surface test_operating_app test_simulation_ui test_surgical_display test_full_encounter test_lens_material test_layered_lens test_surface_contact test_anatomy_contact test_anatomical_app test_tissue_injury test_injury_flow test_injury_case test_injury_app test_visual_snapshot test_anterior_segment test_hydro_surface test_corneal_shell_injury test_volumetric_encounter test_volumetric_injury test_flap_boundary test_capsule_extraction test_extraction_case test_tool_exchange; do
            Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script "res://tests/$suite.gd"
          done
      - name: Rendered integration
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 Godot_v4.7.2-stable_linux.x86_64 --path godot --script res://tests/test_playthrough.gd -- --capture
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 Godot_v4.7.2-stable_linux.x86_64 --path godot --script res://tests/test_simulator_render.gd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-game-captures
          path: godot/reports/
          if-no-files-found: ignore
